name: gold
on:
  schedule:
    - cron: "15 7 * * *"
    - cron: "15 21 * * *"
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 抓数并生成页面
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          rm -rf gm && mkdir gm
          unzip -o "$(ls *.zip | head -1)" -d gm
          cd gm/gold-monitor
          python3 update.py
          cp index.html ../../index.html
          if [ -f gha/notify.py ]; then cp gha/notify.py ../../notify.py; fi
      - name: 提交页面
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --staged --quiet || git commit -m "update $(date -u +%m-%d_%H:%M)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
