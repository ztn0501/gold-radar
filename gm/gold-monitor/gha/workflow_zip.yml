name: gold
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 抓数并生成页面
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MANUAL: ${{ github.event_name }}
        run: |
          rm -rf gm && mkdir gm
          Z=$(ls *-lite*.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then Z=$(ls *.zip | head -1); fi
          echo "zip=$Z"
          unzip -o "$Z" -d gm
          D=$(dirname "$(find gm -name update.py -print -quit)")
          echo "workdir=$D"
          cd "$D"
          cp "$GITHUB_WORKSPACE/alert_state.json" alert_state.json 2>/dev/null || true
          python3 update.py
          if [ -f gha/notify.py ]; then python3 gha/notify.py || true; fi
          cp alert_state.json "$GITHUB_WORKSPACE/alert_state.json" 2>/dev/null || true
          cp index.html "$GITHUB_WORKSPACE/index.html"
      - name: 提交页面
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --staged --quiet || git commit -m "update $(date -u +%m-%d_%H:%M)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
