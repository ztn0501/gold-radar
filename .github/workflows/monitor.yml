name: gold
on:
  schedule:
    # 北京 06:30 = UTC 22:30。伦敦金日线在纽约 17:00 收盘（夏令时 UTC 21:00 / 冬令时 UTC 22:00），
    # 取 22:30 一年四季都在收盘之后，不用随夏令时调整。
    - cron: "30 22 * * *"
    # 只刷新页面价格，不判定、不推送
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  # 按 schedule 分组，避免 22:30 两条 cron 互相取消
  group: pages-${{ github.event.schedule }}
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASS: ${{ secrets.MAIL_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 抓数并生成页面
        run: |
          rm -rf gm && mkdir gm
          Z=$(ls gold-monitor.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then Z=$(ls *-lite*.zip 2>/dev/null | head -1); fi
          if [ -z "$Z" ]; then Z=$(ls *.zip | head -1); fi
          unzip -o "$Z" -d gm
          D=$(dirname "$(find gm -name update.py -print -quit)")
          cd "$D"
          cp "$GITHUB_WORKSPACE/alert_state.json" alert_state.json 2>/dev/null || true
          python3 update.py
          cp alert_state.json "$GITHUB_WORKSPACE/alert_state.json" 2>/dev/null || true
          cp index.html "$GITHUB_WORKSPACE/index.html"
      - name: 推送（只在结算那一次）
        if: github.event.schedule == '30 22 * * *'
        run: |
          D=$(dirname "$(find gm -name update.py -print -quit)")
          cd "$D"
          python3 gha/notify.py || true
          cp alert_state.json "$GITHUB_WORKSPACE/alert_state.json" 2>/dev/null || true
      - name: 提交页面
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --staged --quiet || git commit -m "update $(date -u +%m-%d_%H:%M)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
